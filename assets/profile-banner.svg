<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Zubair Ahmed - Neon Matrix</title>
  <desc id="desc">Classic black terminal banner with vivid monochrome hacker-green text and subtle Matrix code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset=".55" stop-color="#071525"/>
      <stop offset="1" stop-color="#100522"/>
    </linearGradient>
